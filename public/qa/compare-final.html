<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian schema final visual comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: #e9edf0;
        color: #18222a;
        font-family: Inter, Arial, sans-serif;
      }
      h1 { margin: 0 0 6px; font-size: 22px; }
      .note { margin: 0 0 18px; color: #5f6a72; font-size: 13px; }
      .comparison { display: grid; gap: 20px; }
      figure {
        margin: 0;
        padding: 12px;
        background: #fff;
        border: 1px solid #d2d9de;
        border-radius: 12px;
        box-shadow: 0 8px 22px rgba(21, 34, 45, 0.08);
      }
      figcaption { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
      .viewport {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #fff;
        border: 1px solid #eef1f3;
      }
      img { width: 100%; height: 100%; display: block; object-fit: contain; }
    </style>
  </head>
  <body>
    <h1>Final full-view comparison · default state</h1>
    <p class="note">Both views are normalized into the same 1280 × 720 comparison viewport.</p>
    <main class="comparison">
      <figure>
        <figcaption>Reference · Hightouch Customer Studio</figcaption>
        <div class="viewport"><img src="reference.png" alt="Reference Hightouch Customer Studio schema screen" /></div>
      </figure>
      <figure>
        <figcaption>Implementation · Meridian schema prototype</figcaption>
        <div class="viewport"><img src="implementation-final.jpg" alt="Implemented Meridian schema prototype" /></div>
      </figure>
    </main>
  </body>
</html>
